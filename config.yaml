# VPS Backup System Configuration
# /etc/vpsbackup/config.yaml

# --- GitHub Settings ---
github:
  # Token is stored separately in /etc/vpsbackup/credentials
  # api_url: GitHub API base URL (change for GitHub Enterprise)
  api_url: "https://api.github.com"
  # Default: repositories are private
  private_repos: true
  # Maximum retries for API calls
  max_retries: 5
  # Retry backoff base in seconds
  retry_backoff: 2

# --- VPS Settings ---
vps:
  # Hostname is auto-detected at install time; override here if needed
  hostname: ""
  # Registry file location
  registry_path: "/var/lib/vpsbackup/registry.json"
  # Working repositories root
  repos_path: "/var/lib/vpsbackup/repositories"
  # State directory
  state_path: "/var/lib/vpsbackup/state"

# --- Backup Settings ---
backup:
  # Seconds to wait after a file event before committing (debounce)
  debounce_seconds: 10
  # Periodic reconciliation scan interval (seconds)
  scan_interval: 300
  # Maximum file size to back up (bytes); GitHub limit is 100MB
  max_file_size: 52428800  # 50 MB
  # Warn (but still attempt) if file exceeds this size
  warn_file_size: 26214400  # 25 MB
  # Initial backup on user registration
  initial_backup: true
  # Back up files existing at time of user onboarding
  backup_existing_files: true
  # Deletion policy: "track" means deletions are committed to Git
  deletion_policy: "track"
  # Number of worker threads per user backup queue
  worker_threads: 1

# --- User Monitoring Settings ---
users:
  # Minimum UID for regular users (ignore system accounts)
  min_uid: 1000
  # Always include root (UID 0)
  include_root: true
  # Root backup directories (only these are monitored for root)
  root_backup_dirs:
    - "/root"
  # How often to check /etc/passwd for new users (seconds)
  user_poll_interval: 30
  # System users to ignore even if UID >= min_uid
  ignored_users:
    - "nobody"
    - "nogroup"
    - "nfsnobody"

# --- Exclusion Rules ---
# These patterns follow .gitignore syntax and are applied relative to
# each user's monitored directory.
exclusions:
  # Directory patterns
  directories:
    - "__pycache__/"
    - ".cache/"
    - "node_modules/"
    - "venv/"
    - ".venv/"
    - "env/"
    - ".env/"
    - "tmp/"
    - "temp/"
    - "logs/"
    - ".git/"
    - ".npm/"
    - ".yarn/"
    - "dist/"
    - "build/"
    - ".next/"
    - ".nuxt/"
    - "vendor/"
    - "bower_components/"
    - ".mypy_cache/"
    - ".pytest_cache/"
    - ".tox/"
    - "htmlcov/"
    - ".coverage/"
    - "site-packages/"
    - "docker/"
    - ".docker/"
  # File patterns
  files:
    - "*.log"
    - "*.log.*"
    - "*.sqlite"
    - "*.sqlite3"
    - "*.db"
    - "*.dump"
    - "*.sql"
    - "*.sql.gz"
    - ".env"
    - ".env.*"
    - "*.pid"
    - "*.sock"
    - "*.swp"
    - "*.swo"
    - "*~"
    - ".DS_Store"
    - "Thumbs.db"
    - "*.pyc"
    - "*.pyo"
    - "*.pyd"
    - "*.class"
    - "*.o"
    - "*.a"
    - "*.so"
    - "*.dylib"
    - "*.dll"
    - "*.exe"
    # Secret / credential files
    - "id_rsa"
    - "id_rsa.pub"
    - "id_ed25519"
    - "id_ed25519.pub"
    - "id_dsa"
    - "id_ecdsa"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - "*.cer"
    - "secrets.yaml"
    - "secrets.yml"
    - "credentials.json"
    - ".htpasswd"
    - ".netrc"
    - "wp-config.php"
    # Database-related
    - "*.rdb"
    - "*.aof"
  # Exact filenames to always exclude (security-critical)
  exact_names:
    - "shadow"
    - "passwd"
    - "sudoers"
    - "authorized_keys"
    - "known_hosts"
    - ".bash_history"
    - ".zsh_history"
    - ".python_history"
    - ".mysql_history"
    - ".psql_history"

# --- Secret Scanning ---
security:
  # Scan file contents for embedded secrets before staging
  scan_for_secrets: true
  # If a secret is detected, skip the file and alert (vs. block everything)
  secret_action: "skip"  # "skip" | "block"
  # Patterns that suggest a file contains secrets (regex, case-insensitive)
  secret_patterns:
    - "-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----"
    - "(?i)(password|passwd|pwd)\\s*[=:]\\s*['\"]?[^\\s'\"]{8,}"
    - "(?i)(api[_-]?key|apikey)\\s*[=:]\\s*['\"]?[A-Za-z0-9_\\-]{16,}"
    - "(?i)(secret[_-]?key|secret)\\s*[=:]\\s*['\"]?[A-Za-z0-9_\\-]{16,}"
    - "(?i)(access[_-]?token|auth[_-]?token)\\s*[=:]\\s*['\"]?[A-Za-z0-9_\\-\\.]{16,}"
    - "AKIA[0-9A-Z]{16}"  # AWS access key
    - "ghp_[A-Za-z0-9]{36}"  # GitHub PAT classic
    - "github_pat_[A-Za-z0-9_]{82}"  # GitHub fine-grained PAT
    - "sk-[A-Za-z0-9]{48}"  # OpenAI key
    - "AIza[0-9A-Za-z\\-_]{35}"  # Google API key

# --- Logging ---
logging:
  level: "INFO"
  log_file: "/var/log/vpsbackup/vpsbackup.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5
  # Never log token values — enforced in code
  redact_tokens: true
